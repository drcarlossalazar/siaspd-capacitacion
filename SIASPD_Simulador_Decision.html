<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIASPD / MAED 2026 · Simulador de Decisión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0F2A4A; --navy-2:#173A63; --navy-3:#20507F;
  --paper:#EEF2F1; --card:#FFFFFF; --ink:#12202E; --ink-soft:#4C5C68; --line:#D9E0DD;
  --lane:#C7362F; --gold:#C79A3B;
  --verde:#2F8F5B; --verde-bg:#E4F3EB;
  --rojo:#C43B3B; --rojo-bg:#FBE7E5;
  --amarillo:#C68B1F; --amarillo-bg:#FCF1DA;
  --azul:#20507F; --azul-bg:#E4EDF5;
  --font-display:'Oswald',"Arial Narrow",sans-serif;
  --font-body:'Inter',system-ui,-apple-system,sans-serif;
  --font-mono:'Roboto Mono',"Consolas",monospace;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--font-body);background:var(--paper);color:var(--ink);line-height:1.55;}
.lane-divider{height:8px;width:100%;background:repeating-linear-gradient(-45deg,var(--lane) 0px,var(--lane) 20px,#fff 20px,#fff 27px);opacity:.85;}

header.topbar{background:var(--navy);color:#fff;padding:14px 22px;box-shadow:0 2px 14px rgba(0,0,0,.18);}
.topbar-inner{max-width:980px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.brand{font-family:var(--font-display);font-weight:600;font-size:19px;display:flex;align-items:baseline;gap:8px;}
.brand small{font-family:var(--font-body);font-weight:500;font-size:11.5px;color:#9FB3C8;letter-spacing:.05em;text-transform:uppercase;}
.brand-tag{font-size:12px;color:#9FB3C8;}
.score-chip{
  font-family:var(--font-mono);font-weight:700;font-size:14px;background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.2);padding:6px 14px;border-radius:20px;
}
.score-chip .gold{color:var(--gold);}

main{max-width:820px;margin:0 auto;padding:34px 22px 90px 22px;}

/* ---------- case select screen ---------- */
.case-card{
  background:var(--card);border:1.5px solid var(--line);border-radius:12px;
  padding:22px 24px;margin-bottom:18px;cursor:pointer;transition:box-shadow .15s, border-color .15s, transform .1s;
}
.case-card:hover{box-shadow:0 6px 20px rgba(15,42,74,.12);border-color:var(--navy-3);transform:translateY(-2px);}
.case-tag{
  display:inline-block;font-family:var(--font-mono);font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;padding:3px 10px;border-radius:20px;margin-bottom:10px;
}
.case-tag.real{background:var(--verde-bg);color:var(--verde);}
.case-tag.ficticio{background:var(--amarillo-bg);color:var(--amarillo);}
.case-card h3{font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--navy);margin:0 0 8px 0;}
.case-card p{font-size:13.5px;color:var(--ink-soft);margin:0 0 10px 0;}
.case-meta{display:flex;gap:16px;font-size:11.5px;color:var(--ink-soft);font-family:var(--font-mono);}

.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;color:var(--lane);text-transform:uppercase;font-weight:700;margin:0 0 10px 0;}
h1.page-title{font-family:var(--font-display);font-weight:600;font-size:clamp(26px,4vw,38px);line-height:1.08;margin:0 0 14px 0;color:var(--navy);}
p.page-sub{font-size:15px;color:var(--ink-soft);margin:0 0 30px 0;max-width:640px;}

/* ---------- progress dots ---------- */
.progress-row{display:flex;align-items:center;gap:6px;margin-bottom:26px;flex-wrap:wrap;}
.pdot{
  width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:10.5px;font-weight:700;
  color:var(--ink-soft);flex:0 0 auto;
}
.pdot.current{border-color:var(--lane);color:var(--lane);box-shadow:0 0 0 3px rgba(199,54,47,.15);}
.pdot.correct{background:var(--verde);border-color:var(--verde);color:#fff;}
.pdot.wrong{background:var(--rojo);border-color:var(--rojo);color:#fff;}
.pline{flex:1 1 auto;height:2px;background:var(--line);min-width:8px;}

/* ---------- stage card ---------- */
.stage-kicker{font-family:var(--font-mono);font-size:11.5px;color:var(--lane);font-weight:700;text-transform:uppercase;letter-spacing:.08em;}
.stage-title{font-family:var(--font-display);font-size:26px;font-weight:600;color:var(--navy);margin:4px 0 16px 0;}
.context-box{
  background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:18px;
  font-size:14px;color:var(--ink);
}
.context-box .cb-label{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;color:var(--ink-soft);letter-spacing:.06em;margin-bottom:8px;}
.context-box table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px;}
.context-box td, .context-box th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;}
.context-box th{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;color:var(--ink-soft);}

.question{font-size:16px;font-weight:600;color:var(--navy);margin:0 0 16px 0;}
.options{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;}
.option{
  text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:9px;
  padding:13px 16px;font-family:var(--font-body);font-size:14px;color:var(--ink);cursor:pointer;
  transition:border-color .15s, background .15s;
}
.option:hover:not(:disabled){border-color:var(--navy-3);background:var(--azul-bg);}
.option:disabled{cursor:default;}
.option.correct{background:var(--verde-bg);border-color:var(--verde);color:#1E5B25;font-weight:600;}
.option.wrong{background:var(--rojo-bg);border-color:var(--rojo);color:#8A2020;}
.option.faded{opacity:.5;}
.option .opt-letter{
  display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--paper);
  align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;font-weight:700;
  margin-right:10px;color:var(--ink-soft);
}

.feedback{
  border-radius:9px;padding:14px 16px;margin-bottom:18px;font-size:13.8px;line-height:1.55;display:none;
}
.feedback.show{display:block;}
.feedback.ok{background:var(--verde-bg);color:#1E5B25;border-left:4px solid var(--verde);}
.feedback.bad{background:var(--rojo-bg);color:#8A2020;border-left:4px solid var(--rojo);}
.feedback b{color:inherit;}

.actions{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
button.btn{
  font-family:var(--font-body);font-weight:600;font-size:13.5px;background:var(--navy);color:#fff;
  border:none;border-radius:7px;padding:11px 20px;cursor:pointer;transition:background .15s;
}
button.btn:hover{background:var(--navy-3);}
button.btn:disabled{background:var(--line);color:var(--ink-soft);cursor:not-allowed;}
button.btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--line);}
button.btn.lane{background:var(--lane);}

/* ---------- end screen ---------- */
.end-scoreboard{
  background:var(--navy);border-radius:12px;padding:34px 30px;text-align:center;margin-bottom:22px;
}
.end-scoreboard .rank{font-family:var(--font-display);font-weight:600;font-size:26px;color:var(--gold);margin-bottom:6px;}
.end-scoreboard .score{font-family:var(--font-mono);font-weight:700;font-size:52px;color:#fff;}
.end-scoreboard .score span{font-size:22px;color:#9FB3C8;}
.end-scoreboard .sub{font-size:13px;color:#9FB3C8;margin-top:6px;}
.summary-table{width:100%;border-collapse:collapse;margin-bottom:24px;}
.summary-table th{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;color:var(--ink-soft);text-align:left;padding:6px 8px;border-bottom:2px solid var(--line);}
.summary-table td{padding:8px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top;}
.summary-table .res-icon{font-weight:700;}
.summary-table .res-icon.ok{color:var(--verde);}
.summary-table .res-icon.bad{color:var(--rojo);}

footer{background:var(--navy);color:#9FB3C8;padding:26px 22px;margin-top:50px;font-size:12px;text-align:center;}

@media (max-width:640px){
  main{padding:24px 16px 70px 16px;}
  .stage-title{font-size:21px;}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div>
      <div class="brand">SIASPD <small>/ MAED 2026</small></div>
      <div class="brand-tag">Simulador de Decisión · INDE Nuevo León</div>
    </div>
    <div class="score-chip" id="scoreChip" style="display:none;">Puntaje: <span class="gold" id="scoreVal">0</span>/100</div>
  </div>
</header>
<div class="lane-divider"></div>

<main id="app"></main>

<footer>SIASPD / MAED 2026 — Simulador de Decisión · Herramienta de capacitación · Dirección de Alto Rendimiento, INDE Nuevo León</footer>
<script>
(function(){
"use strict";

/* ============================================================
   DATOS DE LOS CASOS
   ============================================================ */
const METHOD_NAMES = ['Desagregación','Cohortes','Trayectorias','Ishikawa','Pareto','AMFE','5 Porqués','Decisión','Plan de Acción','CAPA'];

const CASES = {

/* ---------------- CASO 1: REAL (Manual SIASPD/MAED 2026, 15.2) --------------- */
activate: {
  id:'activate', tag:'real',
  title:'Actívate Nuevo León',
  description:'Caso real documentado en el Manual SIASPD/MAED 2026 (sección 15.2): programa comunitario de activación física para adultos mayores en 5 parques de la zona metropolitana de Monterrey.',
  meta:{ 'Población':'200 adultos mayores (60+)', 'Adherencia real a 3 meses':'38%', 'Meta institucional':'65%' },
  realResult:'El manual proyecta, tras aplicar la cadena completa de 10 métodos, una adherencia de 65–70% a 3 meses.',
  stages:[
    { method:0, title:'Ubicar el problema',
      context:{label:'Adherencia a 3 meses por segmento', rows:[
        ['55–65 años','65%'],['66–74 años','42%'],['75+ años','18%'],['Con condición crónica documentada','23%'],['Promedio general del programa','38%']
      ]},
      question:'¿Dónde se concentra realmente el problema de baja adherencia?',
      options:[
        {t:'En todo el programa por igual: hay que reforzar la promoción general para atraer más participantes.', c:false, f:'Tratar el 38% como un problema uniforme es justo la trampa que la Desagregación busca evitar: los datos muestran que la caída NO está distribuida parejo entre segmentos.'},
        {t:'En los participantes de 75+ años y con condición crónica documentada, donde la adherencia cae a 18–23%.', c:true, f:'Correcto. La Desagregación localiza el segmento exacto: 75+ años y condición crónica, muy por debajo del 65% que logra el segmento 55–65 años.'},
        {t:'En las mujeres, que representan el 70% de las participantes.', c:false, f:'El sexo no es la variable que explica la caída de adherencia según los datos disponibles; es una variable irrelevante para este diagnóstico.'},
        {t:'En la falta de espacio físico en los 5 parques.', c:false, f:'Esto salta directo a una hipótesis de solución sin evidencia de que ese sea el problema real: es el error de intervenir sin diagnosticar.'},
      ]},
    { method:1, title:'¿Es sistémico?',
      context:{label:'Historial de 3 cohortes de inscripción', rows:[
        ['Cohorte 2023','Abandono masivo semanas 6–8'],['Cohorte 2024','Abandono masivo semanas 6–8'],['Cohorte 2025','Abandono masivo semanas 6–8'],
      ]},
      question:'Con el criterio de las 3 cohortes, ¿cómo se diagnostica este problema?',
      options:[
        {t:'Generacional: mala suerte de la generación 2025.', c:false, f:'El patrón no aparece solo en 2025: se repite igual en las 3 cohortes consecutivas, lo que descarta la explicación generacional.'},
        {t:'Sistémico: el mismo patrón se repite en 3 cohortes consecutivas → el diseño del programa no retiene a los participantes de mayor edad y fragilidad.', c:true, f:'Correcto. Tres cohortes con el mismo patrón cumplen el criterio del manual para diagnóstico sistémico, lo que apunta hacia un rediseño (Kaikaku), no solo paciencia.'},
        {t:'No se puede determinar sin encuestar a los participantes de este año.', c:false, f:'El criterio de 3 cohortes que ya tenemos es exactamente el que el manual usa para decidir; no hace falta más información para este paso.'},
        {t:'Es un comportamiento normal en programas de activación física y no amerita intervención.', c:false, f:'Tratar una tasa de abandono repetida como "normal" es evitar el diagnóstico, no hacerlo.'},
      ]},
    { method:2, title:'¿Dónde se rompe el proceso?',
      context:{label:'Datos cualitativos de abandono', rows:[
        ['% de abandonos ocurridos en semanas 5–8','55%'],['Motivo más reportado','"Mucho dolor" / "ya no puedo seguirles el ritmo"'],
      ]},
      question:'¿Dónde debe concentrarse la intervención según el embudo de conversión?',
      options:[
        {t:'En las semanas 1–2, reforzando la bienvenida al programa.', c:false, f:'Los datos no muestran fuga en las semanas 1–2; concentrar ahí los recursos ignora el cuello de botella real.'},
        {t:'De forma pareja a lo largo de las 12 semanas del programa.', c:false, f:'Distribuir recursos parejo diluye el impacto sobre el tramo donde realmente se pierden más participantes.'},
        {t:'En la transición semana 5–8, que concentra el 55% de los abandonos: el cuello de botella identificado.', c:true, f:'Correcto. El embudo de conversión localiza el drop-off crítico exactamente en semanas 5–8, coincidiendo con el reporte cualitativo de dolor y ritmo excesivo.'},
        {t:'En la semana 12, el cierre del programa.', c:false, f:'No hay evidencia de fuga en el cierre del programa; la mayoría del abandono ya ocurrió antes.'},
      ]},
    { method:3, title:'Entender por qué',
      context:{label:'Causa observada por el equipo técnico', rows:[
        ['Observación','El instructor no cuenta con formación en gerontología del ejercicio y aplica la misma intensidad a todo el grupo, sin importar edad o condición funcional.'],
      ]},
      question:'¿En qué categoría del Ishikawa deportivo se clasifica mejor esta causa?',
      options:[
        {t:'Entorno', c:false, f:'Entorno se refiere a condiciones externas (instalaciones, clima, apoyo familiar), no a la formación del personal técnico.'},
        {t:'Entrenador', c:true, f:'Correcto. La formación y competencia técnica del instructor —incluida su preparación en gerontología del ejercicio— cae directamente en la categoría Entrenador.'},
        {t:'Psicología', c:false, f:'Esta categoría cubre factores psicológicos del participante (miedo, motivación), no la formación técnica del instructor.'},
        {t:'Evaluación del Talento', c:false, f:'Esta categoría aplica más a contextos de alto rendimiento (detección/selección); no describe la formación del instructor.'},
      ]},
    { method:4, title:'Priorizar qué atacar primero',
      context:{label:'Causas identificadas y su frecuencia relativa', rows:[
        ['DOMS (dolor muscular tardío) no gestionado','35%'],['Falta de soporte social entre participantes','25%'],['Intensidad no individualizada por condición funcional','18%'],['Miedo a la lesión','12%'],['Ausencia de evaluación inicial','6%'],['Otras causas menores','4%'],
      ]},
      question:'Aplicando la regla 80/20, ¿qué combinación de causas debe priorizarse?',
      options:[
        {t:'Solo el DOMS, porque es la causa individual más frecuente.', c:false, f:'El DOMS por sí solo (35%) no alcanza el 80% acumulado; priorizar solo una causa deja fuera factores que también explican una parte relevante del problema.'},
        {t:'DOMS + Falta de soporte social + Intensidad no individualizada (suman 78%, prácticamente el umbral del 80%).', c:true, f:'Correcto. Estas tres causas vitales explican la gran mayoría del abandono (el manual reporta 78%): ahí deben concentrarse los recursos.'},
        {t:'Las 6 causas por igual, para no dejar ninguna fuera.', c:false, f:'Repartir el esfuerzo entre 6 causas por igual es precisamente lo que el Pareto busca evitar: dispersión de recursos sobre causas de bajo impacto.'},
        {t:'Solo la causa con el IPR más alto del AMFE.', c:false, f:'Eso mezcla dos métodos distintos: el Pareto prioriza por frecuencia/impacto, el AMFE por riesgo. El IPR se calcula en el Método 6, no aquí.'},
      ]},
    { method:5, title:'Prevenir que falle de nuevo',
      context:{label:'Modos de falla evaluados (IPR = Severidad × Ocurrencia × Detección)', rows:[
        ['Participante con osteoartritis de rodilla en programa sin adaptación','IPR = 80'],['Instructor llega 5 minutos tarde ocasionalmente','IPR = 12'],['Falta de agua disponible en día caluroso','IPR = 20'],
      ]},
      question:'¿Cuál modo de falla requiere acción preventiva inmediata?',
      options:[
        {t:'Instructor llega tarde ocasionalmente.', c:false, f:'Con IPR = 12, es un riesgo bajo comparado con las otras opciones; no amerita acción preventiva inmediata.'},
        {t:'Falta de agua en día caluroso.', c:false, f:'Con IPR = 20, es un riesgo menor frente al de la osteoartritis sin adaptación.'},
        {t:'Participante con osteoartritis de rodilla en programa sin adaptación (IPR = 80, el más alto).', c:true, f:'Correcto. El AMFE prioriza por riesgo real, no solo por frecuencia: este modo de falla tiene el IPR más alto y exige una acción preventiva —evaluación musculoesquelética en sesión 1— antes de que ocurra una lesión grave.'},
        {t:'Los tres por igual, ya que cualquier riesgo merece la misma prioridad.', c:false, f:'Tratar todos los riesgos igual contradice el propósito mismo del AMFE, que es justamente priorizar según el nivel de riesgo calculado.'},
      ]},
    { method:6, title:'Profundización causal',
      context:{label:'Cadena de porqués en curso', rows:[
        ['¿Por qué hay tanto DOMS y dolor reportado?','Porque la intensidad no se individualiza por condición funcional.'],
      ]},
      question:'Siguiendo la cadena hasta la causa raíz operativa, ¿cuál de las siguientes es la mejor continuación?',
      options:[
        {t:'"Porque a los adultos mayores no les gusta hacer ejercicio."', c:false, f:'Es una generalización no accionable que culpa a la persona en vez de examinar el proceso institucional; no es una causa raíz operativa.'},
        {t:'"Porque el programa fue diseñado sin una evaluación funcional inicial (Senior Fitness Test de Rikli y Jones, 2013)."', c:true, f:'Correcto. Esta es la causa raíz documentada en el manual: una decisión institucional concreta —no incluir una evaluación funcional inicial— que el programa puede corregir directamente.'},
        {t:'"Porque el clima de Monterrey es muy caluroso."', c:false, f:'El clima es un factor no controlable que no explica por qué la intensidad no se individualiza; no es la causa raíz de este problema específico.'},
        {t:'"Porque faltan más parques en la ciudad."', c:false, f:'No explica el DOMS ni es una causa accionable a corto plazo dentro del programa.'},
      ]},
    { method:7, title:'Decidir con evidencia',
      context:{label:'Benchmarking con referente externo (Jalisco)', rows:[
        ['% de programas con evaluación funcional inicial — Jalisco','100%'],['% de programas con evaluación funcional inicial — Nuevo León','0%'],['Diagnóstico confirmado (Método 2)','SISTÉMICO'],
      ]},
      question:'¿Qué tipo de intervención corresponde?',
      options:[
        {t:'Kaizen: agregar solo un recordatorio verbal sobre el dolor muscular.', c:false, f:'Un problema sistémico requiere más que un ajuste incremental menor; el Kaizen se queda corto frente a la brecha estructural detectada.'},
        {t:'Kaikaku: rediseñar el proceso de incorporación, incluyendo evaluación funcional obligatoria y grupos diferenciados.', c:true, f:'Correcto. El diagnóstico sistémico y la brecha de 100% vs. 0% frente al referente externo justifican un rediseño estructural del proceso de incorporación: exactamente lo que Kaikaku significa.'},
        {t:'Kakushin: crear un programa de activación totalmente nuevo con tecnología de punta.', c:false, f:'Sería sobre-intervención: el problema no requiere reinventar el paradigma completo, solo rediseñar el proceso de incorporación existente.'},
        {t:'Ninguna intervención: monitorear un ciclo más antes de decidir.', c:false, f:'El diagnóstico sistémico ya está confirmado con 3 cohortes; esperar un ciclo más solo perpetúa el mismo patrón de abandono.'},

      options:[

        {t:'"Incluir evaluación funcional (Senior Fitness Test, 5 min/participante) en la sesión 1. Responsable: Coordinador de Programa. Fecha: inicio del próximo ciclo. Indicador: 100% de participantes evaluados antes de la sesión 2."', c:true, f:'Correcto. Tiene los cuatro elementos que el manual exige: actividad concreta, responsable único, fecha específica e indicador de éxito verificable.'},
        {t:'"Pedir a los instructores que tengan más paciencia con el grupo de mayor edad."', c:false, f:'No es verificable ni medible; depende de una actitud, no de una acción concreta con evidencia de cumplimiento.'},
        {t:'"Evaluar en algún momento si el programa está funcionando."', c:false, f:'Sin fecha ni indicador concreto, esto no puede darle seguimiento el sistema CAPA.'},
      ]},
    { method:9, title:'Documentar la solución',
      context:{label:'3 meses después de implementar la evaluación funcional y los grupos diferenciados', rows:[]},
      question:'¿Cuándo puede cerrarse formalmente esta acción CAPA?',
      options:[
        {t:'Cuando el coordinador reporte verbalmente que "todo va mejor".', c:false, f:'Un reporte verbal no es evidencia verificable; el CAPA exige verificación objetiva, no confianza en la palabra del responsable.'},
        {t:'Automáticamente a los 3 meses, sin revisar los datos.', c:false, f:'El cierre no depende del calendario, sino de la evidencia real de que la acción se ejecutó y funcionó.'},
        {t:'Cuando exista evidencia verificable (registro de evaluaciones aplicadas, datos de adherencia) y se documente la lección aprendida.', c:true, f:'Correcto. Así cierra un CAPA riguroso: con evidencia objetiva y una lección aprendida documentada que queda como aprendizaje institucional para el siguiente ciclo.'},
        {t:'Nunca: este tipo de CAPA no se cierra, queda abierto indefinidamente.', c:false, f:'Un CAPA que nunca cierra pierde su función de control; el sistema requiere verificación y cierre, no permanencia indefinida.'},
      ]},
  ]
},

/* ---------------- CASO 2: PRÁCTICA (FICTICIO) --------------- */
gimnasia: {

/* ============================================================
   ESTADO DEL JUEGO
   ============================================================ */
let state = {
  screen:'select', // select | playing | end
  caseId:null,
  stageIdx:0,
  score:0,
  results:[], // {correct:bool, attempts:1|2}
  attemptsThisStage:0,
  answeredThisStage:false,
};

const app = document.getElementById('app');
const scoreChip = document.getElementById('scoreChip');
const scoreVal = document.getElementById('scoreVal');

function updateScoreChip(){
  if(state.screen==='playing'){
    scoreChip.style.display='inline-block';
    scoreVal.textContent = state.score;
  } else {
    scoreChip.style.display='none';
  }
}

/* ---------------- PANTALLA: selección de caso ---------------- */
function renderSelect(){
  updateScoreChip();
  app.innerHTML = `
    <p class="eyebrow">Simulador de Decisión</p>
    <h1 class="page-title">Practica los 10 métodos del SIASPD tomando decisiones reales.</h1>
    <p class="page-sub">Elige un caso. En cada uno de los 10 pasos se te presentarán datos y varias opciones: solo una refleja correctamente la metodología. Recibirás retroalimentación inmediata y un puntaje final.</p>
    <div id="caseList"></div>
  `;
  const list = document.getElementById('caseList');
  Object.values(CASES).forEach(c=>{
    const card = document.createElement('div');
    card.className = 'case-card';
    card.innerHTML = `
      <span class="case-tag ${c.tag}">${c.tag==='real' ? 'Caso real del manual' : 'Caso de práctica (ficticio)'}</span>
      <h3>${c.title}</h3>
      <p>${c.description}</p>
      <div class="case-meta">${Object.entries(c.meta).map(([k,v])=>`<span>${k}: <b style="color:var(--navy)">${v}</b></span>`).join('')}</div>
    `;
    card.addEventListener('click', ()=> startCase(c.id));
    list.appendChild(card);
  });
}

function startCase(caseId){
  state = {screen:'playing', caseId, stageIdx:0, score:0, results:[], attemptsThisStage:0, answeredThisStage:false};
  renderPlaying();
}

/* ---------------- PANTALLA: jugando ---------------- */
function renderPlaying(){
  updateScoreChip();
  const kase = CASES[state.caseId];
  const stage = kase.stages[state.stageIdx];
  const total = kase.stages.length;

  app.innerHTML = `
    <p class="eyebrow">${kase.title}${kase.tag==='ficticio' ? ' · caso de práctica (ficticio)' : ''}</p>
    <div class="progress-row" id="progressRow"></div>
    <div class="stage-kicker">Método ${state.stageIdx+1} de ${total} · ${METHOD_NAMES[stage.method]}</div>
    <div class="stage-title">${stage.title}</div>
    ${stage.context.rows.length ? `
    <div class="context-box">
      <div class="cb-label">${stage.context.label}</div>
      <table><tbody>
        ${stage.context.rows.map(r=>`<tr><td>${r[0]}</td><td><b>${r[1]}</b></td></tr>`).join('')}
      </tbody></table>
    </div>` : ''}
    <div class="question">${stage.question}</div>
    <div class="options" id="optionsWrap"></div>
    <div class="feedback" id="feedbackBox"></div>
    <div class="actions">
      <button class="btn ghost" id="quitBtn">Salir al menú</button>
      <button class="btn lane" id="nextBtn" style="display:none;">Siguiente método ▶</button>
    </div>
  `;
  renderProgressRow();

  const wrap = document.getElementById('optionsWrap');
  const letters = ['A','B','C','D'];
  stage.options.forEach((opt, i)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.innerHTML = `<span class="opt-letter">${letters[i]}</span>${opt.t}`;
    btn.addEventListener('click', ()=> handleAnswer(i));
    wrap.appendChild(btn);
  });

  document.getElementById('quitBtn').addEventListener('click', ()=>{
    state.screen='select'; renderSelect();
  });
  document.getElementById('nextBtn').addEventListener('click', goNextStage);
}

function renderProgressRow(){
  const kase = CASES[state.caseId];
  const row = document.getElementById('progressRow');
  row.innerHTML = '';
  kase.stages.forEach((s,i)=>{
    if(i>0){
      const line = document.createElement('div');
      line.className = 'pline';
      row.appendChild(line);
    }
    const dot = document.createElement('div');
    let cls = 'pdot';
    if(i === state.stageIdx) cls += ' current';
    else if(state.results[i]){ cls += state.results[i].correct ? ' correct' : ' wrong'; }
    dot.className = cls;
    dot.textContent = (i+1);
    row.appendChild(dot);
  });
}

function handleAnswer(i){
  if(state.answeredThisStage) return;
  const kase = CASES[state.caseId];
  const stage = kase.stages[state.stageIdx];
  const opt = stage.options[i];
  const buttons = document.querySelectorAll('.option');
  state.attemptsThisStage++;

  if(opt.c){
    buttons[i].classList.add('correct');
    buttons.forEach((b,bi)=>{ if(bi!==i) b.disabled = true; b.classList.add('faded'); });
    buttons[i].disabled = true; buttons[i].classList.remove('faded');
    const pts = state.attemptsThisStage === 1 ? 10 : 5;
    state.score += pts;
    state.results[state.stageIdx] = {correct:true, attempts:state.attemptsThisStage};
    showFeedback(true, opt.f, pts);
    finishStage();
  } else {
    buttons[i].classList.add('wrong');
    buttons[i].disabled = true;
    if(state.attemptsThisStage >= 2){
      // revelar la correcta
      const correctIdx = stage.options.findIndex(o=>o.c);
      buttons[correctIdx].classList.add('correct');
      buttons.forEach((b,bi)=>{ if(bi!==i && bi!==correctIdx){ b.disabled = true; b.classList.add('faded'); } });
      state.results[state.stageIdx] = {correct:false, attempts:state.attemptsThisStage};
      showFeedback(false, opt.f + ' <br><br><b>Respuesta correcta:</b> ' + stage.options[correctIdx].t, 0);
      finishStage();
    } else {
      showFeedback(false, opt.f + ' <br><br>Intenta de nuevo.', null);
    }
  }
  updateScoreChip();
  renderProgressRow();
}

function showFeedback(ok, text, pts){
  const box = document.getElementById('feedbackBox');
  box.className = 'feedback show ' + (ok ? 'ok' : 'bad');
  box.innerHTML = (ok ? '<b>✓ Correcto.</b> ' : '<b>✗ No es la mejor respuesta.</b> ') + text +
    (pts!==null && pts!==undefined ? `<br><br><b>+${pts} puntos</b>` : '');
}

function finishStage(){
  state.answeredThisStage = true;
  const kase = CASES[state.caseId];
  const isLast = state.stageIdx === kase.stages.length - 1;
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.style.display = 'inline-block';
  nextBtn.textContent = isLast ? 'Ver resultado final ▶' : 'Siguiente método ▶';
}

function goNextStage(){
  const kase = CASES[state.caseId];
  if(state.stageIdx < kase.stages.length - 1){
    state.stageIdx++;
    state.attemptsThisStage = 0;
    state.answeredThisStage = false;
    renderPlaying();
    window.scrollTo({top:0, behavior:'smooth'});
  } else {
    state.screen = 'end';
    renderEnd();
  }
}

/* ---------------- PANTALLA: resultado final ---------------- */
function rankFor(score){
  if(score >= 90) return {label:'Diagnosticador Experto SIASPD', note:'Dominio sólido de la cadena metodológica completa.'};
  if(score >= 70) return {label:'Diagnosticador Competente', note:'Buen manejo general; revisa los métodos donde perdiste puntos.'};
  if(score >= 40) return {label:'Diagnosticador en Formación', note:'Vas por buen camino. Repite el caso prestando atención a la retroalimentación.'};
  return {label:'Sigue practicando', note:'Vuelve a recorrer la cadena: cada método construye sobre el anterior.'};
}

function renderEnd(){
  updateScoreChip();
  const kase = CASES[state.caseId];
  const rank = rankFor(state.score);
  const correctCount = state.results.filter(r=>r.correct).length;

  app.innerHTML = `
    <p class="eyebrow">${kase.title} — Resultado final</p>
    <div class="end-scoreboard">
      <div class="rank">${rank.label}</div>
      <div class="score">${state.score}<span>/100</span></div>
      <div class="sub">${correctCount} de ${kase.stages.length} métodos resueltos correctamente al primer intento o con retroalimentación · ${rank.note}</div>
    </div>
    ${kase.realResult ? `<div class="feedback show ok" style="margin-bottom:24px;"><b>Resultado real documentado en el manual:</b> ${kase.realResult}</div>` : ''}
    <table class="summary-table">
      <thead><tr><th>#</th><th>Método</th><th>Resultado</th></tr></thead>
      <tbody>
        ${kase.stages.map((s,i)=>{
          const r = state.results[i];
          return `<tr>
            <td>${i+1}</td>
            <td>${METHOD_NAMES[s.method]} — ${s.title}</td>
            <td><span class="res-icon ${r && r.correct ? 'ok':'bad'}">${r && r.correct ? '✓ Correcto' : '✗ Con ayuda'}</span> ${r && r.attempts>1 ? '<span style="color:var(--ink-soft);font-size:11px;">(2º intento)</span>':''}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
    <div class="actions">
      <button class="btn ghost" id="menuBtn">◀ Elegir otro caso</button>
      <button class="btn lane" id="retryBtn">Repetir este caso</button>
    </div>
  `;
  document.getElementById('menuBtn').addEventListener('click', ()=>{ state.screen='select'; renderSelect(); });
  document.getElementById('retryBtn').addEventListener('click', ()=> startCase(kase.id));
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------------- INICIO ---------------- */
renderSelect();
})();
</script>
